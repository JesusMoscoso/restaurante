<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bosque Nuboso | Souvenirs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite"
    />
    <style>
      .material-symbols-outlined {
        font-family: "Material Symbols Outlined";
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
    <link rel="stylesheet" href="../estilos/sourvenirs.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <a class="navbar-brand" href="../index.html">
          <img
            class="navbar-logo"
            src="../imagenes/nav.png"
            alt="Vive La Paz Bosque Nuboso"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item text-center">
              <a class="nav-link" href="tours.html">
                <i class="bi bi-leaf d-block mb-1"></i>
                Experiencias
              </a>
            </li>
            <li class="nav-item text-center">
              <a class="nav-link" href="restaurantes.html">
                <i class="bi bi-fork-knife d-block mb-1"></i>
                Restaurantes
              </a>
            </li>
            <li class="nav-item text-center">
              <a
                class="nav-link disabled"
                href="#"
                tabindex="-1"
                aria-disabled="true"
              >
                <i class="bi bi-binoculars d-block mb-1"></i>
                Miradores
              </a>
            </li>
            <li class="nav-item text-center">
              <a class="nav-link active fw-bold" href="souvenirs.html">
                <i class="bi bi-bag-heart d-block mb-1"></i>
                Souvenirs
              </a>
            </li>
            <li class="nav-item text-center">
              <a class="nav-link" href="hospedajes.html">
                <i class="bi bi-house-heart d-block mb-1"></i>
                Hospedajes
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="hero">
      <div class="container hero-content text-center">
        <h1>Souvenirs</h1>
        <p>
          Elige productos artesanales y recuerdos típicos: paños, sombreros,
          figurillas y piezas inspiradas en la naturaleza de La Paz.
        </p>
        <a
          class="btn btn-outline-dark rounded-pill px-4 mt-3"
          href="../index.html"
        >
          Volver al inicio
        </a>
      </div>
    </section>

    <main class="container my-5">
      <section class="products-section py-5">
        <div class="section-header mb-4">
          <div>
            <h2>Productos destacados</h2>
            <p class="text-muted mb-0">
              🎉 Llévate un pedacito de esta aventura
            </p>
          </div>
        </div>

        <div
          id="souvenir-list"
          class="row gx-4 gy-4 justify-content-center"
        ></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const souvenirs = [
        {
          nombre: "Figura de madera típica",
          descripcion:
            "Figura tallada a mano con motivos de la fauna y la cultura costarricense.",
          precio: "₡9.800",
          imagen:
            "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80",
        },
        {
          nombre: "Paño bordado artesanal",
          descripcion:
            "Paño decorativo con bordados de flores tropicales y colores vivos.",
          precio: "₡7.500",
          imagen:
            "https://images.unsplash.com/photo-1493666438817-866a91353ca9?auto=format&fit=crop&w=800&q=80",
        },
        {
          nombre: "Sombrero típico",
          descripcion:
            "Sombrero ligero y colorido inspirado en el diseño tradicional costarricense.",
          precio: "₡8.200",
          imagen:
            "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80",
        },
        {
          nombre: "Pulsera artesanal",
          descripcion:
            "Pulsera hecha con semillas y fibras naturales de la región.",
          precio: "₡3.200",
          imagen:
            "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80",
        },
        {
          nombre: "Jabón natural de café",
          descripcion:
            "Jabón hecho a mano con café local para una experiencia aromática auténtica.",
          precio: "₡4.000",
          imagen:
            "https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=800&q=80",
        },
        {
          nombre: "Tabla decorativa de hojas",
          descripcion:
            "Tabla de madera pintada con motivos de bosque nativo y animales.",
          precio: "₡11.500",
          imagen:
            "https://images.unsplash.com/photo-1501004318641-4a9ceb5e4bf6?auto=format&fit=crop&w=800&q=80",
        },
        {
          nombre: "Postal de La Paz",
          descripcion:
            "Postal ilustrada con paisajes del Bosque Nuboso y la cultura local.",
          precio: "₡1.800",
          imagen:
            "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80",
        },
        {
          nombre: "Bolsa reciclable",
          descripcion:
            "Bolsa de tela con diseño de Costa Rica, perfecta para llevar recuerdos.",
          precio: "₡5.400",
          imagen:
            "https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=800&q=80",
        },
      ];

      const souvenirList = document.getElementById("souvenir-list");

      function renderSouvenirs() {
        const pageSouvenirs = souvenirs;

        souvenirList.innerHTML = pageSouvenirs
          .map(
            (item) => `
            <div class="col-12 col-sm-6 col-lg-4 d-flex justify-content-center">
              <article class="product-card card h-100 shadow-sm">
                <img src="${item.imagen}" alt="${item.nombre}" class="product-image card-img-top" />
                <div class="card-body d-flex flex-column">
                  <h3 class="card-title">${item.nombre}</h3>
                  <p class="card-text">${item.descripcion}</p>
                  <div class="mt-auto d-flex align-items-center justify-content-between gap-2">
                    <span class="product-price">${item.precio}</span>
                    <div class="heart-holder">
                      <button class="heart-btn" type="button" aria-label="Agregar a favoritos">
                        <span class="material-symbols-outlined heart-icon">favorite</span>
                      </button>
                    </div>
                  </div>
                </div>
              </article>
            </div>
          `,
          )
          .join("");
      }

      window.renderSouvenirs = renderSouvenirs;
      renderSouvenirs();
    </script>
  </body>
</html>
